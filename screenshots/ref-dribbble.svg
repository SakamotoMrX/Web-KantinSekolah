<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="40%" style="stop-color:#B0E0E6"/>
      <stop offset="70%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <radialGradient id="cloud1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Sky background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="120" rx="120" ry="40" fill="white" opacity="0.85"/>
  <ellipse cx="250" cy="110" rx="80" ry="35" fill="white" opacity="0.9"/>
  <ellipse cx="160" cy="115" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="800" cy="80" rx="100" ry="35" fill="white" opacity="0.7"/>
  <ellipse cx="850" cy="70" rx="70" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="500" cy="200" rx="140" ry="45" fill="white" opacity="0.6"/>
  <!-- Hero text -->
  <text x="80" y="320" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64B5F6" font-weight="600" letter-spacing="3" text-transform="uppercase">COLD BREW COFFEE &amp; CAFE</text>
  <text x="80" y="400" font-family="Inter,system-ui,sans-serif" font-size="72" fill="#111111" font-weight="900" letter-spacing="-2">Bold coffee.</text>
  <text x="80" y="480" font-family="Inter,system-ui,sans-serif" font-size="72" fill="#111111" font-weight="900" letter-spacing="-2">Better moments.</text>
  <text x="80" y="540" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#374151">The fan favorites, best served cold.</text>
  <!-- Floating cups -->
  <g transform="translate(750,250) rotate(-5)">
    <rect x="-30" y="-60" width="60" height="90" rx="12" fill="#FCE4D6" stroke="#E8D5C4" stroke-width="2"/>
    <rect x="-25" y="-55" width="50" height="20" rx="6" fill="#F5D5BE"/>
    <text x="0" y="-40" font-family="Inter,sans-serif" font-size="10" fill="#8B6914" text-anchor="middle" font-weight="700">PEACH</text>
  </g>
  <g transform="translate(900,350) rotate(3)">
    <rect x="-28" y="-55" width="56" height="85" rx="12" fill="#E2EFDA" stroke="#C8DFC0" stroke-width="2"/>
    <rect x="-23" y="-50" width="46" height="18" rx="6" fill="#D0E8C8"/>
    <text x="0" y="-37" font-family="Inter,sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle" font-weight="700">MATCHA</text>
  </g>
  <g transform="translate(1000,200) rotate(-2)">
    <rect x="-26" y="-50" width="52" height="80" rx="12" fill="#FFF2CC" stroke="#F0E4B0" stroke-width="2"/>
    <rect x="-21" y="-45" width="42" height="16" rx="6" fill="#F5E6A0"/>
    <text x="0" y="-33" font-family="Inter,sans-serif" font-size="10" fill="#F57F17" text-anchor="middle" font-weight="700">MANGO</text>
  </g>
  <g transform="translate(850,480) rotate(4)">
    <rect x="-26" y="-50" width="52" height="80" rx="12" fill="#F8CECC" stroke="#E8B8B6" stroke-width="2"/>
    <rect x="-21" y="-45" width="42" height="16" rx="6" fill="#F0B8B4"/>
    <text x="0" y="-33" font-family="Inter,sans-serif" font-size="10" fill="#C62828" text-anchor="middle" font-weight="700">BERRY</text>
  </g>
  <!-- Splash droplets -->
  <circle cx="720" cy="300" r="5" fill="#90CAF9" opacity="0.7"/>
  <circle cx="950" cy="280" r="3" fill="#64B5F6" opacity="0.6"/>
  <circle cx="880" cy="450" r="4" fill="#B0E0E6" opacity="0.8"/>
  <!-- CTA buttons -->
  <rect x="80" y="580" width="160" height="48" rx="24" fill="#111111"/>
  <text x="160" y="610" font-family="Inter,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Order Now</text>
  <rect x="260" y="580" width="160" height="48" rx="24" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="610" font-family="Inter,sans-serif" font-size="14" fill="#111111" text-anchor="middle" font-weight="600">Find a Store</text>
</svg>
