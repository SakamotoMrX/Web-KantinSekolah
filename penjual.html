<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Penjual - Kantin Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-orange-500 text-white px-4 py-5 shadow-lg">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold">Dashboard Penjual - Kantin Sekolah</h1>
        <p class="text-sm text-orange-100">Kelola pesanan masuk real-time</p>
      </div>
      <a href="index.html" class="bg-white/20 hover:bg-white/30 transition rounded-xl px-3 py-2 text-sm font-semibold shrink-0">
        ← Siswa
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5">

    <!-- Stats -->
    <section class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p id="stat-total" class="text-2xl sm:text-3xl font-extrabold text-orange-500">0</p>
        <p class="text-xs text-gray-500 font-medium mt-1">Total Pesanan</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p id="stat-baru" class="text-2xl sm:text-3xl font-extrabold text-blue-500">0</p>
        <p class="text-xs text-gray-500 font-medium mt-1">Baru (Dipesan)</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p id="stat-siap" class="text-2xl sm:text-3xl font-extrabold text-green-500">0</p>
        <p class="text-xs text-gray-500 font-medium mt-1">Siap Diambil</p>
      </div>
    </section>

    <!-- Filter & Actions -->
    <section class="flex flex-wrap items-center gap-2 mb-5 bg-white rounded-xl shadow p-3">
      <select id="filter" onchange="render()" class="border border-gray-300 rounded-xl px-3 py-2 text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">
        <option value="Semua">Semua</option>
        <option value="Dipesan">Dipesan</option>
        <option value="Diterima">Diterima</option>
        <option value="Disiapkan">Disiapkan</option>
        <option value="Siap Diambil">Siap Diambil</option>
        <option value="Selesai">Selesai</option>
      </select>
      <button onclick="hapusSelesai()" class="ml-auto bg-gray-200 hover:bg-gray-300 transition text-gray-700 text-sm font-semibold px-3 py-2 rounded-xl">Hapus Selesai</button>
      <button onclick="hapusSemua()" class="bg-red-100 hover:bg-red-200 transition text-red-600 text-sm font-semibold px-3 py-2 rounded-xl">Hapus Semua</button>
    </section>

    <!-- Orders -->
    <section id="orders" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>

    <!-- Empty state -->
    <p id="empty" class="hidden text-center text-gray-400 font-medium py-16">Belum ada pesanan</p>
  </main>

<script>
const API_URL = '/api/orders';

async function apiGetOrders() {
  try { const r = await fetch(API_URL); if (r.ok) return await r.json(); } catch {}
  try { return JSON.parse(localStorage.getItem('kantin_orders') || '[]'); } catch { return []; }
}

async function apiPatchStatus(id, status) {
  try {
    let r = await fetch(API_URL + '?id=' + encodeURIComponent(id) + '&status=' + encodeURIComponent(status), { method: 'PATCH' });
    if (r.ok) return true;
    r = await fetch(API_URL, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status }) });
    return r.ok;
  } catch { return false; }
}

async function apiDelete(clear) {
  try { const r = await fetch(API_URL + '?clear=' + clear, { method: 'DELETE' }); return r.ok; } catch { return false; }
}

const FLOW = {
  'Dipesan':     { next: 'Diterima',   label: 'Terima Pesanan' },
  'Diterima':    { next: 'Disiapkan',  label: 'Siapkan' },
  'Disiapkan':   { next: 'Siap Diambil', label: 'Siap Diambil' },
  'Siap Diambil':{ next: 'Selesai',    label: 'Selesai' },
  'Selesai':     null
};
const BADGE = {
  'Dipesan':      'bg-blue-100 text-blue-700',
  'Diterima':     'bg-indigo-100 text-indigo-700',
  'Disiapkan':    'bg-yellow-100 text-yellow-700',
  'Siap Diambil': 'bg-green-100 text-green-700 animate-pulse',
  'Selesai':      'bg-gray-100 text-gray-500'
};

function rupiah(n) { return 'Rp ' + n.toLocaleString('id-ID'); }

function fallbackOrders() {
  try { return JSON.parse(localStorage.getItem('kantin_orders') || '[]'); } catch { return []; }
}

function saveFallbackOrders(orders) {
  localStorage.setItem('kantin_orders', JSON.stringify(orders));
}

async function nextStatus(id) {
  const orders = await apiGetOrders();
  const o = orders.find(x => x.id === id);
  if (!o || !FLOW[o.status]) return;
  const newStatus = FLOW[o.status].next;
  if (!(await apiPatchStatus(id, newStatus))) {
    // fallback localStorage update
    const local = fallbackOrders();
    const lo = local.find(x => x.id === id);
    if (lo) { lo.status = newStatus; saveFallbackOrders(local); }
  }
  render();
}

async function hapusSelesai() {
  if (!confirm('Hapus semua pesanan berstatus Selesai?')) return;
  if (!(await apiDelete('selesai'))) {
    saveFallbackOrders(fallbackOrders().filter(o => o.status !== 'Selesai'));
  }
  render();
}

async function hapusSemua() {
  if (!confirm('Hapus SEMUA pesanan? Tidak bisa dibatalkan.')) return;
  if (!(await apiDelete('all'))) {
    saveFallbackOrders([]);
  }
  render();
}

async function render() {
  // ponytail: urut = posisi array (index.html push kronologis), cukup reverse
  const ordersRaw = await apiGetOrders();
  const orders = ordersRaw.slice().reverse();

  document.getElementById('stat-total').textContent = orders.length;
  document.getElementById('stat-baru').textContent = orders.filter(o => o.status === 'Dipesan').length;
  document.getElementById('stat-siap').textContent = orders.filter(o => o.status === 'Siap Diambil').length;

  const filter = document.getElementById('filter').value;
  const list = filter === 'Semua' ? orders : orders.filter(o => o.status === filter);

  const empty = document.getElementById('empty');
  empty.classList.toggle('hidden', list.length > 0);

  document.getElementById('orders').innerHTML = list.map(o => `
    <article class="bg-white rounded-xl shadow hover:shadow-md transition p-4">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center gap-3">
          <span class="text-3xl font-extrabold text-orange-500">${o.antrian}</span>
          <span class="text-[10px] text-gray-400 font-mono">${o.id}</span>
        </div>
        <span class="${BADGE[o.status] || BADGE['Dipesan']} text-xs font-bold px-2.5 py-1 rounded-full">${o.status}</span>
      </div>
      <div class="mb-2">
        <p class="font-bold text-sm">${o.warungNama}</p>
        <p class="text-xs text-gray-400">${o.waktu}</p>
      </div>
      <ul class="text-sm text-gray-600 space-y-1 border-t border-gray-100 pt-2">
        ${o.items.map(i => `<li class="flex justify-between"><span>${i.nama} ×${i.qty}</span><span>${rupiah(i.harga * i.qty)}</span></li>`).join('')}
      </ul>
      <div class="flex justify-between font-bold text-sm mt-2 pt-2 border-t border-gray-200">
        <span>Total</span><span class="text-orange-500">${rupiah(o.total)}</span>
      </div>
      <button onclick="nextStatus('${o.id}')"
        class="mt-3 w-full ${FLOW[o.status] ? 'bg-orange-500 hover:bg-orange-600' : 'bg-gray-200 cursor-not-allowed'} text-white font-semibold py-2.5 rounded-xl text-sm transition"
        ${FLOW[o.status] ? '' : 'disabled'}>
        ${FLOW[o.status] ? FLOW[o.status].label : 'Selesai'}
      </button>
    </article>`).join('');
}

setInterval(render, 1500);
window.addEventListener('storage', render);
render();
</script>
</body>
</html>
